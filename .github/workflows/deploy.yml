# ============================================================
# Hexo 自动构建并部署到 GitHub Pages（gh-pages 分支）
# ============================================================
# 配好之后，日常更新只需一条命令：git push
#
# 一次性设置：
#   1. 仓库 Settings → Pages → Source = "Deploy from a branch"
#      分支 = gh-pages，文件夹 = /(root)
#   2. 仓库 Settings → Actions → General → Workflow permissions
#      选 "Read and write permissions"
# ============================================================

name: Deploy Hexo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境诊断
        run: |
          echo "=== 仓库根目录 ==="
          ls -la
          echo "=== 主题是否存在 ==="
          ls -la themes/ || true
          ls themes/butterfly/_config.yml && echo "主题配置存在" || echo "!!! 主题缺失"
          echo "=== Node 版本 ==="
          node -v
          npm -v
          echo "=== package.json scripts ==="
          node -e "console.log(JSON.stringify(require('./package.json').scripts,null,1))"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 构建
        run: npx hexo generate

      - name: 检查产物
        run: |
          ls -la public/ | head -20
          test -f public/index.html && echo "index.html 已生成" || (echo "!!! 构建产物缺失" && exit 1)

      - name: 部署到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
